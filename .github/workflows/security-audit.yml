name: dependency-security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "31 4 * * 2"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (including development tooling)
        run: npm audit --audit-level=high
  python-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes --no-deps -r requirements/ci.txt && python -m pip install --no-deps --no-build-isolation -e .
      - name: Freeze third-party distributions without the editable project
        run: pip freeze --exclude-editable > /tmp/fleetops-audit-requirements.txt
      - run: pip-audit --strict --disable-pip --no-deps -r /tmp/fleetops-audit-requirements.txt
