name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Demo fleet end to end
        run: fleetkpi demo /tmp/demo

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Export the SQL engine and demo fleet from the Python package
        working-directory: .
        run: pip install -e . && fleetkpi web-export --out web/public
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Maths and metric-network tests
        run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fleetkpi .
      - name: Image builds the demo pipeline
        run: docker run --rm --entrypoint fleetkpi fleetkpi demo /tmp/demo
