name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Pages and release call this whole workflow and publish only if every job, including the security E2E suite, passes.
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from hash-locked requirements
        run: python -m pip install --require-hashes --no-deps -r requirements/ci.txt && python -m pip install --no-deps --no-build-isolation -e .
      - name: requirements/*.txt match uv.lock
        run: |
          # compare without uv's header comment, which names the output file
          uv export --frozen -q --extra dev --group build --group audit --group lock --no-emit-project --format requirements-txt | grep -v '^#' | diff -u <(grep -v '^#' requirements/ci.txt) -
          uv export --frozen -q --no-dev --group build --no-emit-project --format requirements-txt | grep -v '^#' | diff -u <(grep -v '^#' requirements/docker.txt) -
      - run: pytest -q
      - name: Demo fleet end to end
        run: fleetkpi demo /tmp/demo

  web:
    # pinned: Playwright's browser builds do not support the ubuntu-latest image (26.04) yet
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Export the SQL engine and demo fleet from the Python package
        working-directory: .
        run: python -m pip install --require-hashes --no-deps -r requirements/ci.txt && python -m pip install --no-deps --no-build-isolation -e . && fleetkpi web-export --out web/public
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - name: Maths and metric-network tests
        run: npm test
      - run: npm run build
      - name: Security end-to-end tests (strict CSP, injected script, hostile workbook, encryption at rest, OCR)
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: Keep the e2e report when a test fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report
          path: web/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: docker build -t fleetkpi .
      - name: Image builds the demo pipeline
        run: docker run --rm --entrypoint fleetkpi fleetkpi demo /tmp/demo

