name: release

# Tag a version (git tag v0.5.0 && git push --tags) to publish the offline package as a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The full CI suite, including the security E2E tests, must pass on the exact commit being released.
  ci:
    uses: ./.github/workflows/ci.yml

  offline-package:
    needs: ci
    # Manual runs publish only from main; tag pushes publish only v* tags.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release and upload the package
      id-token: write       # sign the build provenance (Sigstore)
      attestations: write   # store it on GitHub
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Export the SQL engine and demo fleet
        run: python -m pip install --require-hashes --no-deps -r requirements/ci.txt && python -m pip install --no-deps --no-build-isolation -e . && fleetkpi web-export --out web/public
      - name: Test and package
        working-directory: web
        run: npm ci --ignore-scripts && npm test && bash scripts/package-offline.sh "${GITHUB_REF_NAME#v}"
      - name: Build provenance attestation (proves the zip was built here, from this commit)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: web/dist/FleetOps-offline-*.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || TAG="offline-$(date +%Y%m%d-%H%M)"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "FleetOps $TAG" \
            --notes "Offline package: unzip, then run the launcher for your system (see README.txt inside). Verify with SHA256SUMS.txt, or check where it was built: gh attestation verify <zip> -R Pemalahmad/FleetOps-KPI-Dashboard"
          gh release upload "$TAG" web/dist/FleetOps-offline-*.zip web/dist/SHA256SUMS.txt --clobber
