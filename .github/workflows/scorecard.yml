name: scorecard

# OpenSSF Scorecard: grades the repository's security practices (pinned dependencies, branch protection, token
# permissions, signed releases...) every week and on pushes to main. Results appear under Security > Code scanning.
on:
  push:
    branches: [main]
  schedule:
    - cron: "29 4 * * 2"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the results to code scanning
      id-token: write          # publish them to the public Scorecard API (for the README badge)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
