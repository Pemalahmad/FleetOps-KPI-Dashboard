name: Bug report
description: Something in FleetOps is broken or shows a wrong number.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please do not attach real fleet files, documents or customer data. Changed values or the files in `samples/` are fine."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open Import\n2. Load samples/fleet-vehicles.xlsx\n3. ..."
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Live site (GitHub Pages), Installed app, Offline package, Python CLI, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and browser
      placeholder: "0.5.0, Chrome 131 on Windows 11"
  - type: textarea
    id: console
    attributes:
      label: Error message or screenshot
      description: From the screen or the browser console (F12). Blur anything private.
